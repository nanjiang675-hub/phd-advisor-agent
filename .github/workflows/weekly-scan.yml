name: Daily advisor scan

on:
  workflow_dispatch:
  schedule:
    # 每天北京时间 08:00 运行
    - cron: "0 0 * * *"

jobs:
  wake-render-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Wake Render agent
        shell: bash
        run: |
          set -euo pipefail
          url="https://phd-advisor-agent.onrender.com/api/faculty"

          for attempt in {1..12}; do
            body="$(curl --silent --show-error --location --max-time 90 "$url" || true)"

            if python -c 'import json,sys; data=json.load(sys.stdin); assert isinstance(data,list)' <<<"$body" 2>/dev/null; then
              echo "Render agent is awake and the daily scan is running."
              exit 0
            fi

            echo "Waiting for Render to wake ($attempt/12)..."
            sleep 20
          done

          echo "Render agent did not become ready."
          exit 1
